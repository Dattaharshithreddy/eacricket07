# Builds the APK on GitHub's machines: open Actions → "Build APK" → the latest run → Artifacts → cricket07-apk.
# ubuntu-24.04 runners ship with the Android SDK preinstalled (ANDROID_HOME), so no SDK setup step is needed.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -20
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: cricket07-apk
          path: app/build/outputs/apk/release/app-release.apk
